{{ define "main" }}
  <section class="intro">
    <h1>{{ site.Title }}</h1>
    {{ .Content }}
    {{ with site.Params.links }}
      <ul class="links">
        {{ range . }}
          <li>
            <a href="{{ .url }}"{{ with .rel }} rel="{{ . }}"{{ end }}>{{ .name }}</a>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </section>
{{ end }}
