{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ with .Pages }}
    <ul class="projects">
      {{ range . }}
        <li>
          <h2 class="project__title">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </h2>
          {{ with .Description }}<p class="project__body">{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
