<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ site.Params.description }}">
<meta name="author" content="{{ site.Title }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:type" content="profile">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{- range site.Params.links }}
<link rel="me" href="{{ .url }}">
{{- end }}
<link rel="preload" href="{{ "fonts/newsreader-latin-opsz-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{- with resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{- end }}
